<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <style>
    html {
      font-size: 18px;
    }

    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.65;
    }

    main {
      max-width: 1000px;   /* was 760px */
      margin: 0 auto;
      padding: 70px 28px 100px;
    }

    h1, h2, h3, h4 {
      color: #000;
      line-height: 1.25;
      font-weight: 600;
    }

    h1 {
      font-size: 2.2rem;
      margin-top: 0;
      margin-bottom: 2rem;
    }

    h2 {
      font-size: 1.55rem;
      margin-top: 3rem;
    }

    h3 {
      font-size: 1.2rem;
      margin-top: 2.2rem;
    }

    p {
      margin: 1.1rem 0;
    }

    a {
      color: #111;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:hover {
      color: #555;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 2rem auto;
    }

    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.85em;
    }

    pre {
      overflow-x: auto;
      padding: 1.2rem;
      background: #f7f7f7;
      border: 1px solid #e5e5e5;
      border-radius: 3px;
      line-height: 1.45;
    }

    blockquote {
      margin: 1.5rem 0;
      padding-left: 1.2rem;
      border-left: 2px solid #ccc;
      color: #444;
    }

    hr {
      border: 0;
      border-top: 1px solid #ddd;
      margin: 3rem 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 2rem 0;
    }

    th, td {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    @media (max-width: 600px) {
      html {
        font-size: 17px;
      }

      main {
        padding: 40px 20px 70px;
      }

      h1 {
        font-size: 1.9rem;
      }
    }

    a img { cursor: zoom-in; }

    figcaption {
      font-size: 0.85rem;
      color: #555;
      line-height: 1.5;
    }

    main > h1:first-of-type {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    main > h1:first-of-type + h2 {
      text-align: center;
      color: #555;
      font-weight: normal;
      margin-top: 0;
    }
    
  </style>

  {% if page.mathjax %}
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
      };
    </script>
    <script async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
  {% endif %}
</head>

<body>
  <main>
    {{ content }}
  </main>
</body>
</html>
